<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="paramify discovery render">
<title><!--TITLE--></title>
<style>
/* One template for every discovery document. Self-contained on purpose: no
   network requests, so the page opens the same in an air-gapped boundary. */
@font-face {
  font-family: "Open Sauce Sans";
  src: url(data:font/woff2;base64,/*FONT*/) format("woff2");
  font-weight: 300 900; font-style: normal; font-display: swap;
}
:root {
  --ground: #fafafa; --surface: #ffffff;
  --ink: #262626; --ink-2: #595959; --ink-3: #8c8c8c;
  --rule: #d9d9d9; --rule-2: #f0f0f0;
  --accent: #1467ff; --accent-deep: #004bd6; --accent-wash: #f0f5ff;
  --bad: #cf1322; --bad-wash: #fff1f0;
  --warn: #ad6800; --warn-wash: #fffbe6;
  --tone-1: #262626; --tone-2: #8c8c8c; --tone-3: #bfbfbf; --tone-4: #e8e8e8;
  --display: "Open Sauce Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "IBM Plex Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 14px/1.5 var(--body); font-variant-numeric: tabular-nums;
}
.page { max-width: 1120px; margin: 0 auto; padding: 48px 32px 96px; }
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* Masthead */
.eyebrow {
  font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin: 0 0 16px;
}
.title-row { display: flex; align-items: center; gap: 16px; }
.title-row img { width: 40px; height: 40px; object-fit: contain; }
h1 {
  font: 650 40px/1.1 var(--display); letter-spacing: -.02em; margin: 0;
}
.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0; margin: 32px 0 0; border-top: 1px solid var(--rule);
}
.facts div { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--rule-2); }
.facts div.wide { grid-column: span 2; }
.facts dt { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.facts dd { margin: 6px 0 0; color: var(--ink); overflow-wrap: anywhere; }

/* Verdict */
.verdict { margin: 32px 0 0; padding: 16px 20px; border-left: 3px solid var(--accent); background: var(--surface); }
.verdict.bad { border-left-color: var(--bad); }
.verdict strong { font-weight: 600; }
.verdict ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); }

/* At a glance */
h2.section-label {
  font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); margin: 56px 0 16px;
}
.glance {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  border-top: 1px solid var(--rule); border-left: 1px solid var(--rule);
}
.tile {
  display: block; text-decoration: none; padding: 18px 18px 16px;
  border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.tile:hover { background: var(--accent-wash); }
.tile .num { display: block; font: 600 32px/1 var(--display); letter-spacing: -.02em; }
.tile .label { display: block; margin-top: 10px; color: var(--ink-2); }
.tile .state { display: block; margin-top: 4px; font: 500 11px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.state.denied, .state.error { color: var(--bad); }
.state.not_enabled, .state.partly_enabled { color: var(--ink-3); }
.state.truncated, .state.partial { color: var(--warn); }
.tile.unread .num, .tile.zero .num { color: var(--tone-3); }

/* Resource sections */
.resource { margin-top: 64px; scroll-margin-top: 24px; }
.res-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
.res-head h3 { font: 600 22px/1.2 var(--display); letter-spacing: -.01em; margin: 0; }
.res-head .count { font: 600 22px/1.2 var(--display); color: var(--ink-3); }
.res-head code { margin-left: auto; color: var(--ink-3); }
.callout { margin: 16px 0 0; padding: 12px 16px; border-left: 3px solid var(--bad); background: var(--bad-wash); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-wash); }
.callout.off { border-left-color: var(--rule); background: var(--surface); }
.off-note { margin: 8px 0 0; color: var(--ink-2); }
.callout p { margin: 0; }
.callout p + p { margin-top: 4px; color: var(--ink-2); }
.note { margin: 16px 0 0; color: var(--ink-2); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 32px; margin: 20px 0 0; }
.dim-name { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.bar { display: flex; height: 6px; margin: 10px 0 8px; background: var(--rule-2); }
.bar span { display: block; height: 100%; }
.bar span + span { border-left: 2px solid var(--ground); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.legend b { color: var(--ink); font-weight: 600; }
.legend i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 0; }
.t1 { background: var(--tone-1); } .t2 { background: var(--tone-2); }
.t3 { background: var(--tone-3); } .t4 { background: var(--tone-4); }

.tools { display: none; align-items: center; gap: 12px; margin: 24px 0 8px; }
.js .tools { display: flex; }
.tools input {
  font: inherit; padding: 7px 10px; width: min(320px, 100%);
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 2px;
}
.tools input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.tools .shown { color: var(--ink-3); }

.table-wrap { overflow-x: auto; margin-top: 16px; background: var(--surface); border: 1px solid var(--rule); }
.js .tools + .table-wrap { margin-top: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
th {
  font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--surface); border-bottom: 1px solid var(--rule);
  white-space: nowrap; position: sticky; top: 0;
}
.js th { cursor: pointer; user-select: none; }
.js th:hover { color: var(--ink); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--ground); }
td.n { text-align: right; } th.n { text-align: right; }
td.id { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
td.name { font-weight: 600; min-width: 200px; }
.nil { color: var(--tone-3); }
td time { white-space: nowrap; }
.copy {
  display: none; margin-left: 8px; padding: 1px 6px; font: 500 10px/1.4 var(--mono);
  letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
  background: none; border: 1px solid transparent; border-radius: 2px; cursor: pointer;
}
.js tr:hover .copy, .copy:focus { display: inline-block; border-color: var(--rule); }
.copy.done { color: var(--ink-3); }
.more { margin: 8px 0 0; color: var(--ink-3); }
details.scopes { margin: 16px 0 0; }
details.scopes summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
details.scopes summary:hover { color: var(--ink); }
details.scopes .table-wrap { margin-top: 8px; max-height: 360px; overflow-y: auto; }

.colophon { margin-top: 80px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12px; }

@media (max-width: 640px) {
  .page { padding: 32px 16px 64px; }
  h1 { font-size: 30px; }
  .res-head code { margin-left: 0; flex-basis: 100%; }
}
@media print {
  body { background: #fff; }
  .page { padding: 0; max-width: none; }
  .tools, .copy { display: none !important; }
  .resource { break-inside: auto; }
  tr { break-inside: avoid; }
  th { position: static; }
  .tile:hover { background: none; }
}
</style>
</head>
<body>
<main class="page">
<!--BODY-->
</main>
<script>
// Progressive enhancement only: the page reads in full without it.
(function () {
  document.documentElement.classList.add("js");

  document.querySelectorAll("[data-filter]").forEach(function (input) {
    var table = document.getElementById(input.getAttribute("data-filter"));
    var shown = input.parentNode.querySelector(".shown");
    var rows = Array.prototype.slice.call(table.tBodies[0].rows);
    input.addEventListener("input", function () {
      var q = input.value.trim().toLowerCase(), n = 0;
      rows.forEach(function (r) {
        var hit = !q || r.textContent.toLowerCase().indexOf(q) !== -1;
        r.hidden = !hit; if (hit) n++;
      });
      shown.textContent = n + " of " + rows.length + " shown";
    });
  });

  document.querySelectorAll("table[data-sortable] th").forEach(function (th, col) {
    th.addEventListener("click", function () {
      var table = th.closest("table"), body = table.tBodies[0];
      var dir = th.getAttribute("aria-sort") === "ascending" ? "descending" : "ascending";
      table.querySelectorAll("th").forEach(function (h) { h.removeAttribute("aria-sort"); });
      th.setAttribute("aria-sort", dir);
      var rows = Array.prototype.slice.call(body.rows);
      rows.sort(function (a, b) {
        var x = a.cells[col].getAttribute("data-v"), y = b.cells[col].getAttribute("data-v");
        var nx = parseFloat(x), ny = parseFloat(y), c;
        if (x === "" && y !== "") c = 1; else if (y === "" && x !== "") c = -1;
        else if (!isNaN(nx) && !isNaN(ny) && String(nx) === x && String(ny) === y) c = nx - ny;
        else c = x.localeCompare(y, undefined, { numeric: true, sensitivity: "base" });
        return dir === "ascending" ? c : -c;
      });
      rows.forEach(function (r) { body.appendChild(r); });
    });
  });

  document.querySelectorAll("td.name").forEach(function (td) {
    var text = td.getAttribute("data-v");
    if (!text || !navigator.clipboard) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.textContent = "Copy";
    b.title = "Copy the exact name, for a config value";
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      navigator.clipboard.writeText(text).then(function () {
        b.textContent = "Copied"; b.classList.add("done");
        setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1400);
      });
    });
    td.appendChild(b);
  });
})();
</script>
</body>
</html>
